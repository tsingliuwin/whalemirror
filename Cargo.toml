[workspace]
resolver = "3"
members = [
  "crates/cordis",
  "crates/dsh-plugin",
  "crates/dsh-llm",
  "crates/dsh-llm-deepseek",
  "crates/dsh-session",
  "crates/dsh-session-projection",
  "crates/dsh-tools",
  "crates/dsh-system-prompt",
  "crates/dsh-agent",
  "crates/dsh-agent-loop",
  "crates/dsh-gpui",
  "crates/dsh-fs",
  "crates/dsh-shell",
  "crates/dsh-web",
  "crates/dsh-search",
  "crates/dsh-compaction",
  "crates/dsh-subagent",
  "crates/dsh-persist",
  "crates/dsh-jobs",
  "crates/dsh-spill",
  "crates/dsh-skill",
]

# vendor 补丁版（0.9.0 基线）：markdown 渲染排版对齐 web（li 6px 间距、圆点次级色
# marker、strong 600、标题边距/字重/行高、hr、blockquote、表格几何）、图片粘贴
# 分流、相对路径 opener，改动见 vendor 内 [dsh] 注释。
[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }
# text 渲染核心（text_view/inline/node/style/utils）0.7 起在 gpui-base——[dsh] 补丁随之
gpui-base = { path = "vendor/gpui-base" }

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "DeepSeek Harness (deepseek-harness) web client rebuilt natively in Rust + GPUI, sharing ~/.dsh session storage with the web build"
# repository 元数据见 GitHub 主页说明（nightly cargo lint unused 误报发布元信息，摘除）

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
base64 = "0.22"
serde_json = { version = "1", features = ["preserve_order"] }
futures = "0.3"
async-trait = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
regex = "1"
bytes = "1"
async-stream = "0.3"
flume = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["default-tls", "stream", "json", "gzip", "brotli", "deflate"] }
# GPUI 生态 gpui-kit 线（0.3.11/0.9.0，2026-11-06 升级）：gpui-pre 为 gpui 本体改名线（lib 名仍 gpui，
# 业务代码 use gpui:: 不变）；平台工厂在 gpui-pre-platform（lib 名 gpui_platform）。
gpui-pre = "0.3.11"
gpui-pre-platform = "0.3.11"
gpui-component = "0.9.0"
gpui-base = "0.9.0"
gpui-kit-assets = "0.9.0"
encoding_rs = "0.8"
codepage = "0.1"